<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1533">
<title>Bang Pay · Paiement sécurisé</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1533;--navy2:#16255c;--or:#ff6a1a;--or2:#ff3d2e;--bg:#f3f0ea;--sf:#fff;--sf2:#f8f6f1;--ink:#121629;--mut:#6a6f85;--line:#e7e3d9;--ok:#0f8a4f;--okbg:#e0f5e9;--wn:#8a5a00;--wnbg:#fff2d1;--rd:#b3261e;--rdbg:#fde7e4;--sh:0 14px 40px rgba(11,21,51,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f22;--sf:#131b36;--sf2:#1a2347;--ink:#eef0fa;--mut:#9aa3c7;--line:#273158;--okbg:#10321f;--ok:#6fe0a2;--wnbg:#3a2f0b;--wn:#ffd479;--rdbg:#3b1815;--rd:#ff9d95;--sh:0 14px 40px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--navy),var(--navy2) 70%);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 92px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;pointer-events:none}
.hero:before{width:240px;height:240px;background:#ff6a1a;right:-80px;top:-90px}
.hero:after{width:220px;height:220px;background:#3b5bff;left:-90px;bottom:-110px;opacity:.5}
.wrap{position:relative;z-index:1;width:min(520px,100%);margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.brand svg.lg{width:46px;height:46px;flex:none;filter:drop-shadow(0 8px 16px rgba(255,106,26,.5))}
.nm{font:800 26px/1 Sora,Inter,sans-serif;letter-spacing:-.6px}.nm b{color:#ff9a4d}
.brand small{display:block;font:600 10.5px Inter;letter-spacing:1.1px;text-transform:uppercase;color:#a9b5e0;margin-top:4px}
.sec{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600}
.sec svg{width:14px;height:14px}
.hi{margin-top:22px}.hi h1{font:700 22px Sora,Inter;letter-spacing:-.4px}.hi p{color:#b9c3e8;font-size:14px;margin-top:2px}
main{position:relative;z-index:2;width:min(520px,100%);margin:-64px auto 24px;padding:0 16px;display:grid;gap:14px}
.card{background:var(--sf);border-radius:24px;padding:20px;box-shadow:var(--sh);animation:up .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.steps{display:flex;justify-content:space-between;margin-bottom:18px;position:relative}
.steps:before{content:"";position:absolute;left:9%;right:9%;top:14px;height:2px;background:var(--line)}
.stp{position:relative;display:grid;justify-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--mut);flex:1}
.stp i{width:30px;height:30px;border-radius:50%;background:var(--sf);border:2px solid var(--line);display:grid;place-items:center;font:700 13px Inter;font-style:normal;transition:.3s}
.stp.on{color:var(--ink)}.stp.on i{border-color:var(--or);background:var(--or);color:#fff;box-shadow:0 0 0 5px rgba(255,106,26,.16)}.stp.dn i{border-color:var(--ok);background:var(--ok);color:#fff}
h2{font:700 20px Sora,Inter,sans-serif;letter-spacing:-.4px}
.sub{color:var(--mut);font-size:14px;margin-top:3px}
.ticket{position:relative;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:20px 18px;margin:16px 0 12px;overflow:hidden}
.ticket:before{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,26,.5),transparent 70%)}
.ticket small{font:700 11px Inter;letter-spacing:1px;text-transform:uppercase;color:#a9b5e0}
.ticket b{display:block;font:800 40px/1.1 Sora,Inter;letter-spacing:-1.4px;margin:4px 0 2px}
.ticket .rf{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c9d2f2;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.25)}
.ticket .rf b{font:700 13px Inter;letter-spacing:.5px;display:inline;margin:0;color:#fff}
.sum{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sum summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer}
.sum summary::-webkit-details-marker{display:none}.sum summary:after{content:"›";transform:rotate(90deg);color:var(--mut);font-size:20px;transition:.2s}.sum[open] summary:after{transform:rotate(-90deg)}
.sum .l{padding:0 14px 12px;display:grid;gap:7px;font-size:13.5px}.sum .l div{display:flex;justify-content:space-between;gap:10px}.sum .l span{color:var(--mut)}
.lbl{font-weight:700;font-size:13.5px;margin:18px 0 8px;display:block}.lbl em{font-style:normal;font-weight:500;color:var(--mut)}
.meth{display:grid;gap:10px}
.m{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--sf);border-radius:18px;padding:11px 14px;cursor:pointer;font:inherit;color:inherit;transition:.18s;min-height:68px}
.m:hover{border-color:#c9c3b3}.m.on{border-color:var(--or);background:rgba(255,106,26,.06);box-shadow:0 0 0 4px rgba(255,106,26,.13)}
.m img{width:46px;height:46px;border-radius:13px;object-fit:cover;flex:none;background:#fff;border:1px solid var(--line)}
.m b{display:block;font-size:15px}.m small{color:var(--mut);font-size:12.5px}
.chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.2s}
.m.on .chk{border-color:var(--or);background:var(--or)}.m.on .chk:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.rcpt{background:var(--sf2);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;display:grid;gap:12px;animation:up .3s both}
.rcpt .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rcpt small{color:var(--mut);font-size:12px;display:block}.rcpt b{font:700 19px Sora;letter-spacing:.4px}
.cp{background:var(--navy);color:#fff;border:0;border-radius:99px;padding:9px 15px;font:600 13px Inter;cursor:pointer;min-height:40px;transition:.15s}
.cp:active{transform:scale(.95)}
ol{padding:0;list-style:none;display:grid;gap:10px;counter-reset:s;margin-top:4px}
ol li{display:flex;gap:11px;font-size:14px;counter-increment:s}ol li:before{content:counter(s);width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font:700 12px Inter;display:grid;place-items:center;flex:none;margin-top:1px}
input[type=text],input[type=tel]{font:inherit;font-size:17px;width:100%;border:2px solid var(--line);border-radius:15px;padding:0 14px;min-height:54px;background:var(--sf);color:inherit;transition:.15s}
input:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 4px rgba(255,106,26,.13)}
.code{text-transform:uppercase;letter-spacing:2px;font-weight:700}
.up{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:18px;padding:14px;cursor:pointer;background:var(--sf2);transition:.2s}
.up:hover{border-color:var(--or)}.up.has{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.up .pv{width:64px;height:64px;border-radius:14px;background:var(--sf);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--or)}.up .pv img{width:100%;height:100%;object-fit:cover}.up .pv svg{width:28px;height:28px}
.up b{display:block;font-size:14.5px}.up small{color:var(--mut);font-size:12.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:58px;border:0;border-radius:99px;background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font:700 16px Inter;cursor:pointer;margin-top:20px;box-shadow:0 12px 26px rgba(255,80,30,.38);text-decoration:none;transition:.15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55;box-shadow:none}.btn svg{width:18px;height:18px}
.btn.gh{background:var(--sf);color:var(--ink);border:2px solid var(--line);box-shadow:none}.btn.wa{background:#25d366;box-shadow:0 12px 26px rgba(37,211,102,.35)}.btn.sm{min-height:50px;margin-top:10px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700}
.p-w{background:var(--wnbg);color:var(--wn)}
.big{display:grid;justify-items:center;text-align:center;gap:10px;padding:6px 0 4px}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center}.ring svg{width:46px;height:46px}
.ring.w{background:var(--wnbg);color:var(--wn)}.ring.o{background:var(--okbg);color:var(--ok);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}.ring.r{background:var(--rdbg);color:var(--rd)}
.ring.o path{stroke-dasharray:30;stroke-dashoffset:30;animation:dr .5s .25s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.spin{animation:sp 1.3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--rdbg);color:var(--rd);border-radius:14px;padding:11px 13px;font-size:14px;font-weight:600;margin-top:12px}
.tl{display:grid;gap:0;margin:16px 0 4px;text-align:left}
.tl div{position:relative;padding:0 0 18px 38px}.tl div:last-child{padding-bottom:0}
.tl div:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}.tl div:last-child:before{display:none}
.tl i{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--sf);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.tl .d i{background:var(--ok);border-color:var(--ok);color:#fff}.tl .n i{border-color:var(--or);background:var(--or);color:#fff;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,106,26,.5)}100%{box-shadow:0 0 0 12px rgba(255,106,26,0)}}
.tl b{display:block;font-size:14.5px}.tl small{color:var(--mut);font-size:12.5px}
.receipt{position:relative;background:var(--sf2);border-radius:18px;padding:16px;margin-top:14px;text-align:left;display:grid;gap:9px;font-size:14px}
.receipt:before,.receipt:after{content:"";position:absolute;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--sf)}.receipt:before{left:-8px;top:50%}.receipt:after{right:-8px;top:50%}
.receipt div{display:flex;justify-content:space-between;gap:10px}.receipt span{color:var(--mut)}.receipt .t{border-top:1px dashed var(--line);padding-top:10px;font-size:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;text-decoration:none;color:var(--ink);background:var(--sf2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-weight:600;font-size:13.5px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trust div{background:var(--sf);border-radius:16px;padding:12px 8px;text-align:center;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(11,21,51,.07);display:grid;gap:6px;justify-items:center}
.trust svg{width:22px;height:22px;color:var(--or)}
.accept{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;opacity:.95}
.accept img{height:34px;width:auto;border-radius:8px;background:#fff;padding:3px 6px}
.help{text-align:center;font-size:13px;color:var(--mut)}.help a{color:#128c4a;font-weight:700;text-decoration:none}
.foot{text-align:center;font-size:12px;color:var(--mut);padding:0 24px 34px;max-width:520px;margin:0 auto}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
</style>
</head>

function paint(){const i=INFO;clearInterval(POLL);
 hi('Bonjour '+esc(i.prenom||'')+' 👋','Finalisez le paiement de votre commande '+esc(i.number));
 if(i.status==='annulee'){hi('Commande annulée','');return $('#app').innerHTML=`<section class="card"><div class="big"><div class="ring r">${IC.x}</div><h2>Commande annulée</h2><p class="sub">Cette commande ne peut plus être payée. Contactez-nous sur WhatsApp si besoin.</p></div><a class="btn gh sm" href="https://wa.me/${WA}">Écrire sur WhatsApp</a></section>`}
 if(i.status==='payee'||i.status==='facturee'||i.pay_status==='valide'){hi('Paiement confirmé 🎉','Merci pour votre confiance');if(!DONE){DONE=true;confetti()}
  return $('#app').innerHTML=`<section class="card">${steps(4)}<div class="big"><div class="ring o">${IC.ok}</div><h2>Paiement confirmé</h2><p class="sub">Votre commande est validée et sera préparée.</p></div>
  <div class="receipt"><div><span>Commande</span><b>${esc(i.number)}</b></div><div><span>Statut</span><b style="color:var(--ok)">Payée</b></div><div class="t"><span>Total payé</span><b>${money(i.total)}</b></div></div>
  <a class="btn" href="${SITE}">Continuer mes achats</a><a class="btn wa sm" href="${waShare}" target="_blank" rel="noopener">Partager Bang Market</a></section>
  <section class="card"><b style="font-size:15px">Découvrir aussi</b><div class="cats" style="margin-top:10px">${['Sacs','Montres','Chaussures','Beauté','Cheveux','Robes','Accessoires'].map(c=>`<a href="${SITE}">${c}</a>`).join('')}</div></section>`}
 if(i.pay_status==='attente'){hi('Paiement envoyé ✅','Nous vérifions votre transaction');POLL=setInterval(()=>load(true),12000);
  return $('#app').innerHTML=`<section class="card">${steps(3)}<div class="big"><div class="ring w">${IC.w}</div><h2>Vérification en cours</h2><p class="sub">Cette page se met à jour toute seule. Vous pouvez la fermer et la rouvrir plus tard avec votre référence.</p><span class="pill p-w">En attente de validation</span></div>
  <div class="tl"><div class="d"><i>✓</i><b>Paiement envoyé</b><small>Votre preuve a bien été reçue</small></div><div class="n"><i>2</i><b>Vérification</b><small>Notre équipe contrôle la transaction</small></div><div><i>3</i><b>Commande confirmée</b><small>Stock réservé, préparation de la commande</small></div></div>
  <div style="margin-top:14px">${sumHtml(i)}</div>
  <a class="btn wa sm" href="https://wa.me/${WA}?text=${encodeURIComponent('Bonjour, j’ai payé la commande '+i.number+' ('+money(i.total)+'). Pouvez-vous vérifier mon paiement ?')}">Accélérer sur WhatsApp</a></section>`}
 form(i.pay_status==='refuse'?'Votre dernier paiement a été refusé'+(i.note?' : '+i.note:'')+'. Vous pouvez réessayer.':'')}

function form(warn,err){const i=INFO,m=METH[SEL];
 $('#app').innerHTML=`<section class="card">${steps(2)}<h2>Payer ma commande</h2><p class="sub">Choisissez un moyen de paiement, envoyez le montant, puis confirmez avec votre preuve.</p>
 ${warn?`<div class="err">${esc(warn)}</div>`:''}
 <div class="ticket"><small>Montant à payer</small><b>${money(i.total)}</b><div class="rf"><span>Commande</span><b>${esc(i.number)}</b></div></div>
 ${sumHtml(i)}
 <span class="lbl">Moyen de paiement</span>
 <div class="meth">${Object.entries(METH).map(([k,v])=>`<button type="button" class="m ${SEL===k?'on':''}" data-m="${k}"><img src="${v.img}" alt=""><span><b>${v.n}</b><small>${spaced(v.num)}</small></span><span class="chk"></span></button>`).join('')}</div>
 <div class="rcpt"><div class="row"><div><small>Envoyer à</small><b>${spaced(m.num)}</b></div><button type="button" class="cp" data-cp="${m.num}">Copier</button></div><div class="row"><div><small>Bénéficiaire</small><b style="font-size:16px">${m.who}</b></div><button type="button" class="cp" data-cp="${m.who}">Copier</button></div></div>
 <span class="lbl">Comment faire ?</span>
 <ol><li><span>Ouvrez ${m.n} sur votre téléphone.</span></li><li><span>Envoyez <b>${money(i.total)}</b> au <b>${spaced(m.num)}</b> (${m.who}).</span></li><li><span>Faites une <b>capture d’écran</b> du message de confirmation et notez le <b>code de transaction</b>.</span></li></ol>
 <form id="f"><span class="lbl">Code de transaction</span><input id="c" type="text" class="code" autocomplete="off" placeholder="Ex. MP2511161234" required minlength="5" maxlength="40">
 <span class="lbl">Capture d’écran de la preuve</span>
 <label class="up ${PROOF?'has':''}" for="pf"><span class="pv">${PROOF?`<img src="${PROOF.url}" alt="">`:IC.cam}</span><span><b>${PROOF?'Preuve ajoutée ✓':'Ajouter la capture'}</b><small>${PROOF?Math.round(PROOF.blob.size/1024)+' Ko · touchez pour changer':'Photo de votre confirmation de paiement'}</small></span></label><input id="pf" type="file" accept="image/*" hidden>
 <span class="lbl">Votre numéro qui a payé <em>(facultatif)</em></span><input id="p" type="tel" inputmode="tel" placeholder="Ex. 0812345678" maxlength="20">
 ${err?`<div class="err">${esc(err)}</div>`:''}<button class="btn" id="go">${IC.lock}J’ai payé · Envoyer</button></form></section>
 <p class="help">Un souci ? <a href="https://wa.me/${WA}">Écrire sur WhatsApp</a></p>`;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{keep();SEL=b.dataset.m;form(warn,err)});
 document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copy(b));
 if(FV.c)$('#c').value=FV.c;if(FV.p)$('#p').value=FV.p;
 $('#pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;keep();const b=$('.up b');b.textContent='Compression…';try{PROOF=await shrink(f)}catch(x){PROOF=null;return form(warn,'Image illisible, essayez une autre capture.')}form(warn,err)};
 $('#f').onsubmit=async e=>{e.preventDefault();if(!PROOF)return form(warn,'Ajoutez la capture d’écran de votre paiement.');keep();
  const bt=$('#go');bt.disabled=true;bt.textContent='Envoi en cours…';
  const path=i.number+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+PROOF.ext;
  const up=await sb.storage.from('payment-proofs').upload(path,PROOF.blob,{contentType:PROOF.blob.type,upsert:false});
  if(up.error)return form(warn,'Envoi de la capture impossible. Vérifiez internet et réessayez.');
  const r=await sb.rpc('submit_payment',{p_order:i.number,p_method:SEL,p_code:FV.c,p_phone:FV.p||null,p_proof:path});
  if(r.error){const t=r.error.message||'';return form(warn,/Failed to fetch|Network/i.test(t)?'Connexion impossible, réessayez.':t)}
  PROOF=null;FV={c:'',p:''};load()}}
let FV={c:'',p:''};const keep=()=>{const c=$('#c'),p=$('#p');if(c)FV.c=c.value;if(p)FV.p=p.value};

async function shrink(file){const url=URL.createObjectURL(file);const img=await new Promise((ok,ko)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=ko;x.src=url});
 let max=1000,q=.72,blob,ext='webp';
 for(let k=0;k<5;k++){const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  blob=await new Promise(r=>c.toBlob(r,'image/webp',q));if(!blob||blob.type!=='image/webp'){ext='jpg';blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q))}
  if(blob.size<=450*1024)break;max*=.8;q-=.08}
 URL.revokeObjectURL(url);return{blob,ext,url:URL.createObjectURL(blob)}}
async function copy(b){const t=b.dataset.cp;try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}
 const o=b.textContent;b.textContent='Copié ✓';setTimeout(()=>b.textContent=o,1500)}
load();
</script>
</body>
</html>
