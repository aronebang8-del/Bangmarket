<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Bang Pay · Paiement sécurisé</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1230;--navy2:#162a63;--or:#ff6a1a;--bg:#f2f4f8;--sf:#fff;--sf2:#f6f7fb;--ink:#0d1330;--mut:#6b7390;--line:#e4e7f0;--ok:#0f8a4f;--okbg:#e2f6ea;--wn:#8a5a00;--wnbg:#fff3d6;--rd:#b3261e;--rdbg:#fdebe8;--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#070b1d;--sf:#0f1630;--sf2:#151e3f;--ink:#eef1fb;--mut:#97a1c6;--line:#222c52;--okbg:#10321f;--ok:#6fe0a2;--wnbg:#392e0b;--wn:#ffd479;--rdbg:#3a1714;--rd:#ff9d95}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100vw;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.app{width:min(480px,100%);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid transparent}
.bar.sc{border-color:var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
.bk{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sf);display:none;place-items:center;color:var(--ink);cursor:pointer;flex:none}
.bk.on{display:grid}.bk svg{width:20px;height:20px}
.lg{display:flex;align-items:center;gap:10px;min-width:0}.lg svg{width:34px;height:34px;flex:none}
.nm{font:700 18px/1 Sora,Inter,sans-serif;letter-spacing:-.4px}.nm b{color:var(--or)}.lg small{display:block;font-size:11px;color:var(--mut);margin-top:2px;font-weight:500}
.sec{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ok);flex:none}
.sec svg{width:14px;height:14px}
main{flex:1;padding:6px 16px 120px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
main>*{min-width:0}main.fx>*{animation:in .35s cubic-bezier(.2,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stepper{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--mut)}
.stepper i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--mut);display:grid;place-items:center;font-size:11.5px}
.stepper .on{color:var(--ink)}.stepper .on i{background:var(--navy);color:#fff}.stepper .dn i{background:var(--ok);color:#fff}
.stepper em{flex:1;height:2px;background:var(--line);border-radius:2px;font-style:normal}
h1{font:700 24px/1.2 Sora,Inter;letter-spacing:-.6px}h2{font:700 17px Sora,Inter;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
/* carte bancaire */
.bc{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;color:#fff;aspect-ratio:1.62/1;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 90% at 100% 0,rgba(255,106,26,.55),transparent 55%),radial-gradient(90% 90% at 0 100%,rgba(70,100,255,.45),transparent 60%),linear-gradient(135deg,#0a1230,#18306e);box-shadow:0 18px 40px rgba(10,18,48,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.bc:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.bc .t{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.bc .t span{font:700 15px Sora;letter-spacing:.5px}.bc .t svg{width:26px;height:26px;opacity:.85}
.chip{width:42px;height:32px;border-radius:7px;background:linear-gradient(135deg,#f5d58a,#c89a3b);position:relative;z-index:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.chip:before,.chip:after{content:"";position:absolute;background:rgba(0,0,0,.2)}.chip:before{left:0;right:0;top:50%;height:1px}.chip:after{top:0;bottom:0;left:38%;width:1px;box-shadow:12px 0 0 rgba(0,0,0,.2)}
.bc .n{font:600 19px Sora;letter-spacing:3px;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.bc .b{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1}
.bc small{display:block;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#b4bfe6;font-weight:600}.bc .b b{font:600 14px Inter;letter-spacing:.5px}
.bc .am{text-align:right}.bc .am b{font:700 26px/1 Sora;letter-spacing:-.8px}
.pn{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pn .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;font-weight:700;font-size:14px}
.pn .hd span{font-weight:500;color:var(--mut);font-size:13px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:14.5px}
.rw span{color:var(--mut)}.rw b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.rw.tt{background:var(--sf2)}.rw.tt b{font:700 18px Sora}.rw.tt span{color:var(--ink);font-weight:600}
.rw .cpb{display:flex;align-items:center;gap:8px}
.ico{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--sf);display:grid;place-items:center;color:var(--ink);cursor:pointer;flex:none;transition:.15s}
.ico svg{width:17px;height:17px}.ico.dn{background:var(--ok);border-color:var(--ok);color:#fff}
.lb{font-weight:700;font-size:13px;letter-spacing:.2px;color:var(--mut);text-transform:uppercase;margin:4px 2px -4px}
.mt{display:grid;gap:10px}
.m{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--sf);border-radius:var(--r);padding:12px 14px;cursor:pointer;font:inherit;color:inherit;transition:.15s;min-height:68px}
.m.on{border-color:var(--navy);box-shadow:0 0 0 3px color-mix(in srgb,var(--navy) 14%,transparent)}
@media (prefers-color-scheme:dark){.m.on{border-color:#7b92ff}}
.m img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#fff;border:1px solid var(--line);flex:none}
.m b{display:block;font-size:15px;font-weight:600}.m small{color:var(--mut);font-size:13px}
.rd{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.m.on .rd{border-color:var(--navy);background:var(--navy)}.m.on .rd:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.nt{display:flex;gap:10px;background:var(--wnbg);color:var(--wn);border-radius:var(--r);padding:12px 14px;font-size:13.5px;font-weight:500}
.nt svg{width:18px;height:18px;flex:none;margin-top:2px}
.okb{background:var(--okbg);color:var(--ok);border-radius:var(--r);padding:12px 14px;font-size:14px;font-weight:600}
.err{background:var(--rdbg);color:var(--rd);border-radius:var(--r);padding:12px 14px;font-size:14px;font-weight:600}
.fld{display:grid;gap:7px}.fld>span{font-weight:600;font-size:13.5px}.fld em{font-style:normal;color:var(--mut);font-weight:500}
input[type=text],input[type=tel]{font:inherit;font-size:17px;width:100%;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;min-height:54px;background:var(--sf);color:inherit;transition:.15s}
input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px color-mix(in srgb,var(--navy) 14%,transparent)}
@media (prefers-color-scheme:dark){input:focus{border-color:#7b92ff}}
.code{text-transform:uppercase;letter-spacing:2px;font-weight:700}
.up{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;cursor:pointer;background:var(--sf)}
.up.has{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.up .pv{width:60px;height:60px;border-radius:12px;background:var(--sf2);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--mut)}.up .pv img{width:100%;height:100%;object-fit:cover}.up .pv svg{width:26px;height:26px}
.up b{display:block;font-size:14.5px}.up small{color:var(--mut);font-size:12.5px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.dock>div{pointer-events:auto;width:min(480px,100%);display:flex;align-items:center;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.dock .tot small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}.dock .tot b{font:700 20px Sora;letter-spacing:-.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;flex:1;min-height:54px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:600 16px Inter;cursor:pointer;text-decoration:none;transition:.15s;padding:0 18px}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55}.btn svg{width:18px;height:18px}
@media (prefers-color-scheme:dark){.btn{background:#3d5afe}}
.btn.or{background:linear-gradient(135deg,#ff7a2a,#ff4d2e)}.btn.gh{background:var(--sf);color:var(--ink);border:1.5px solid var(--line)}.btn.wa{background:#1fae56}
.col{display:grid;gap:10px}
.stt{display:grid;justify-items:center;text-align:center;gap:8px;padding:10px 0 4px}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center}.ring svg{width:40px;height:40px}
.ring.w{background:var(--wnbg);color:var(--wn)}.ring.o{background:var(--okbg);color:var(--ok);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}.ring.r{background:var(--rdbg);color:var(--rd)}
.ring.o path{stroke-dasharray:30;stroke-dashoffset:30;animation:dr .5s .25s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.spin{animation:sp 1.3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tl{padding:6px 16px 14px}.tl div{position:relative;padding:0 0 16px 36px}.tl div:last-child{padding-bottom:0}
.tl div:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}.tl div:last-child:before{display:none}
.tl i{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--sf);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--mut)}
.tl .d i{background:var(--ok);border-color:var(--ok);color:#fff}.tl .n i{border-color:var(--or);background:var(--or);color:#fff;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,106,26,.5)}100%{box-shadow:0 0 0 11px rgba(255,106,26,0)}}
.tl b{display:block;font-size:14.5px;font-weight:600}.tl small{color:var(--mut);font-size:12.5px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;text-decoration:none;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:99px;padding:8px 15px;font-weight:600;font-size:13.5px}
.accept{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.accept img{height:30px;width:auto;border-radius:7px;background:#fff;padding:3px 6px;border:1px solid var(--line)}
.help{text-align:center;font-size:13px;color:var(--mut)}.help a{color:var(--ok);font-weight:700;text-decoration:none}
.foot{text-align:center;font-size:11.5px;color:var(--mut);line-height:1.5}
</style>
</head>

function setPage(p,push){$('#app').classList.add('fx');PAGE=p;if(push)history.pushState({p},'','#'+(p===2?'confirmer':'payer'));window.scrollTo(0,0);paint()}

function askRef(err){clearInterval(POLL);back(false);dock('');
 $('#app').innerHTML=`${hd('Payer ma commande','Entrez la référence reçue après votre commande.')}<form id="f" class="col"><label class="fld"><span>Référence de commande</span><input id="r" type="text" class="code" autocomplete="off" placeholder="CMD-0000" value="${esc(REF)}" required></label>${err?`<div class="err">${esc(err)}</div>`:''}<button class="btn or">Continuer ${IC.arr}</button></form>`;
 $('#f').onsubmit=e=>{e.preventDefault();REF=$('#r').value.trim().toUpperCase();load()}}

async function load(quiet){
 if(!REF)return askRef();
 if(!quiet){back(false);dock('');$('#app').innerHTML='<div class="stt"><div class="ring w">'+IC.w+'</div><b>Chargement…</b></div>'}
 const r=await sb.rpc('order_pay_info',{p_order:REF});
 if(r.error)return askRef('Connexion impossible. Vérifiez internet et réessayez.');
 if(!r.data||!r.data.length)return askRef('Commande introuvable. Vérifiez la référence.');
 if(!quiet)$('#app').classList.add('fx');INFO=r.data[0];PAGE=location.hash==='#confirmer'?2:1;history.replaceState(null,'','?c='+encodeURIComponent(INFO.number)+location.hash);paint()}

function card(i){const n=i.number.replace(/^([A-Za-z]+)-?(\d+)$/,'$1 $2');
 return `<div class="bc"><div class="t"><span>BANG PAY</span>${IC.ctl}</div><div class="chip"></div><div class="n">${esc(n)}</div><div class="b"><div><small>Titulaire</small><b>${esc((i.prenom||'Client').toUpperCase())}</b></div><div class="am"><small>À payer</small><b>${money(i.total)}</b></div></div></div>`}

function statusPage(){const i=INFO,paid=i.status==='payee'||i.status==='facturee'||i.pay_status==='valide';back(false);
 const rows=`<div class="pn"><div class="rw"><span>Commande</span><b>${esc(i.number)}</b></div>${sumRows(i)}<div class="rw tt"><span>Total</span><b>${money(i.total)}</b></div></div>`;
 if(i.status==='annulee'){dock('');$('#app').innerHTML=`<div class="stt"><div class="ring r">${IC.x}</div><h2>Commande annulée</h2><p class="sub">Cette commande ne peut plus être payée.</p></div><a class="btn gh" href="https://wa.me/${WA}">Écrire sur WhatsApp</a>`;return true}
 if(paid){dock('');$('#app').innerHTML=`<div class="stt"><div class="ring o">${IC.ok}</div><h2>Paiement confirmé</h2><p class="sub">Merci ${esc(i.prenom||'')} ! Votre commande est validée et sera préparée.</p></div>${rows}<div class="col"><a class="btn or" href="${SITE}">Continuer mes achats</a><a class="btn gh" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Je commande en gros sur Bang Market 🛍️ et je paie avec Bang Pay : '+SITE)}">Partager Bang Market</a></div><div class="cats">${['Sacs','Montres','Chaussures','Beauté','Cheveux','Robes','Accessoires'].map(c=>`<a href="${SITE}">${c}</a>`).join('')}</div>`;return true}
 if(i.pay_status==='attente'){dock('');POLL=setInterval(()=>load(true),12000);
  $('#app').innerHTML=`<div class="stt"><div class="ring w">${IC.w}</div><h2>Vérification en cours</h2><p class="sub">Cette page se met à jour toute seule. Vous pouvez la fermer et la rouvrir avec votre référence.</p></div>
  <div class="pn"><div class="hd">Suivi du paiement</div><div class="tl"><div class="d"><i>✓</i><b>Preuve envoyée</b><small>Nous l’avons bien reçue</small></div><div class="n"><i>2</i><b>Vérification</b><small>Notre équipe contrôle la transaction</small></div><div><i>3</i><b>Paiement confirmé</b><small>Commande préparée</small></div></div></div>${rows}
  <a class="btn wa" href="https://wa.me/${WA}?text=${encodeURIComponent('Bonjour, j’ai payé la commande '+i.number+' ('+money(i.total)+'). Pouvez-vous vérifier mon paiement ?')}">Accélérer sur WhatsApp</a>`;return true}
 return false}

function paint(){clearInterval(POLL);if(statusPage())return;const i=INFO;
 const warn=i.pay_status==='refuse'?'Votre dernier paiement a été refusé'+(i.note?' : '+i.note:'')+'. Vous pouvez réessayer.':'';
 const ok=i.status==='confirmee'?'<div class="okb">✅ Votre commande est validée. Il ne reste que le paiement.</div>':'';
 if(PAGE===2)return page2(warn,'',ok);
 const m=METH[SEL];back(false);
 $('#app').innerHTML=`${stepper(1)}${hd('Régler ma commande','Choisissez votre moyen de paiement.')}${warn?`<div class="err">${esc(warn)}</div>`:''}${ok}
 ${card(i)}
 <div class="pn"><div class="hd">Récapitulatif<span>${(i.items||[]).reduce((a,x)=>a+x.q,0)} pièces</span></div>${sumRows(i)}<div class="rw tt"><span>Total à payer</span><b>${money(i.total)}</b></div></div>
 <div class="lb">Moyen de paiement</div>
 <div class="mt">${Object.entries(METH).map(([k,v])=>`<button type="button" class="m ${SEL===k?'on':''}" data-m="${k}"><img src="${v.img}" alt=""><span><b>${v.n}</b><small>${spaced(v.num)}</small></span><span class="rd"></span></button>`).join('')}</div>
 <div class="pn"><div class="hd">Détails du transfert<span>${m.n}</span></div>
  ${[['Bénéficiaire',m.who,m.who],['Numéro',spaced(m.num),m.num],['Montant exact',money(i.total),String(i.total)],['Motif / référence',i.number,i.number]].map(([l,v,c])=>`<div class="rw"><span>${l}</span><div class="cpb"><b>${esc(v)}</b><button type="button" class="ico" data-cp="${esc(c)}" aria-label="Copier">${IC.cp}</button></div></div>`).join('')}</div>
 <div class="nt">${IC.info}<span>Envoyez exactement ${money(i.total)} depuis ${m.n}, puis passez à l’étape suivante pour envoyer votre preuve.</span></div>

 dock(`<div class="tot"><small>Total</small><b>${money(i.total)}</b></div><button class="btn" id="next">Continuer ${IC.arr}</button>`);
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{$('#app').classList.remove('fx');SEL=b.dataset.m;paint()});
 document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copy(b));
 $('#next').onclick=()=>setPage(2,true)}

function page2(warn,err,ok){const i=INFO,m=METH[SEL];back(true);
 $('#app').innerHTML=`${stepper(2)}${hd('Confirmer mon paiement','Ajoutez la preuve de votre transfert.')}${warn?`<div class="err">${esc(warn)}</div>`:''}${ok||''}
 <div class="pn"><div class="rw" style="border-top:0"><div style="display:flex;align-items:center;gap:12px"><img src="${m.img}" alt="" style="width:40px;height:40px;border-radius:11px;border:1px solid var(--line)"><div><b style="display:block;text-align:left">${m.n}</b><span style="font-size:13px;display:block;text-align:left">${spaced(m.num)}</span></div></div><b style="font:700 18px Sora">${money(i.total)}</b></div></div>
 <form id="f" class="col">
 <label class="fld"><span>Code de transaction</span><input id="c" type="text" class="code" autocomplete="off" placeholder="Ex. MP2511161234" required minlength="5" maxlength="40"></label>
 <div class="fld"><span>Capture d’écran de la preuve</span><label class="up ${PROOF?'has':''}" for="pf"><span class="pv">${PROOF?`<img src="${PROOF.url}" alt="">`:IC.cam}</span><span><b>${PROOF?'Preuve ajoutée ✓':'Ajouter la capture'}</b><small>${PROOF?Math.round(PROOF.blob.size/1024)+' Ko · touchez pour changer':'Photo du message de confirmation'}</small></span></label><input id="pf" type="file" accept="image/*" hidden></div>
 <label class="fld"><span>Votre numéro qui a payé <em>(facultatif)</em></span><input id="p" type="tel" inputmode="tel" placeholder="Ex. 0812345678" maxlength="20"></label>
 ${err?`<div class="err">${esc(err)}</div>`:''}</form>
 <p class="help">Un souci ? <a href="https://wa.me/${WA}">Écrire sur WhatsApp</a></p>`;
 dock(`<button class="btn or" id="go" form="f">${IC.lock}Envoyer ma preuve</button>`);
 if(FV.c)$('#c').value=FV.c;if(FV.p)$('#p').value=FV.p;
 $('#pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;keep();$('#app').classList.remove('fx');$('.up b').textContent='Compression…';try{PROOF=await shrink(f)}catch(x){PROOF=null;return page2(warn,'Image illisible, essayez une autre capture.',ok)}page2(warn,'',ok)};
 $('#f').onsubmit=async e=>{e.preventDefault();keep();if(!PROOF)return page2(warn,'Ajoutez la capture d’écran de votre paiement.',ok);
  const bt=$('#go');bt.disabled=true;bt.textContent='Envoi en cours…';
  const path=i.number+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+PROOF.ext;
  const up=await sb.storage.from('payment-proofs').upload(path,PROOF.blob,{contentType:PROOF.blob.type,upsert:false});
  if(up.error)return page2(warn,'Envoi de la capture impossible. Vérifiez internet et réessayez.',ok);
  const r=await sb.rpc('submit_payment',{p_order:i.number,p_method:SEL,p_code:FV.c,p_phone:FV.p||null,p_proof:path});
  if(r.error){const t=r.error.message||'';return page2(warn,/Failed to fetch|Network/i.test(t)?'Connexion impossible, réessayez.':t,ok)}
  PROOF=null;FV={c:'',p:''};PAGE=1;history.replaceState(null,'','?c='+encodeURIComponent(i.number));load()}}

async function shrink(file){const url=URL.createObjectURL(file);const img=await new Promise((ok,ko)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=ko;x.src=url});
 let max=1000,q=.72,blob,ext='webp';
 for(let k=0;k<5;k++){const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  blob=await new Promise(r=>c.toBlob(r,'image/webp',q));if(!blob||blob.type!=='image/webp'){ext='jpg';blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q))}
  if(blob.size<=450*1024)break;max*=.8;q-=.08}
 URL.revokeObjectURL(url);return{blob,ext,url:URL.createObjectURL(blob)}}
async function copy(b){const t=b.dataset.cp;try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}
 b.classList.add('dn');b.innerHTML=IC.ok;setTimeout(()=>{b.classList.remove('dn');b.innerHTML=IC.cp},1400)}
load();
</script>
