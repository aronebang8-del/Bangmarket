<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Bang Market · Espace administrateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe3da;--surface:#fff;--ink:#1c1c1e;--mut:#6b6b70;--card:#f6f6f7;--line:#ececee;--or:#ff6a1a;--or-ink:#c2410c;--peach:#fbd9c6;--red:#c62828;--ok:#14663a;
--sh:0 2px 12px rgba(0,0,0,.08);--glow:0 8px 18px rgba(255,106,26,.4);
--s-n-bg:#e6eefc;--s-n-fg:#1e4fa8;--s-c-bg:#fff1cf;--s-c-fg:#7a5200;--s-f-bg:#ede6fa;--s-f-fg:#5a2fb0;--s-p-bg:#dff3e6;--s-p-fg:#14663a;--s-i-bg:#1c1c1e;--s-i-fg:#fff;--s-x-bg:#ececee;--s-x-fg:#5f5f66}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2320;--surface:#3a302b;--ink:#f4ece6;--mut:#b5a89f;--card:#2f2723;--line:#4a3e38;--peach:#5a3a2a;--or-ink:#ff9a5c;--red:#ff8a80;--ok:#7fd6a1;--sh:none;
--s-n-bg:#1c2a44;--s-n-fg:#9cbcf5;--s-c-bg:#3d2f0c;--s-c-fg:#f2c66b;--s-f-bg:#2c2147;--s-f-fg:#c4adf3;--s-p-bg:#153322;--s-p-fg:#7fd6a1;--s-i-bg:#f4ece6;--s-i-fg:#1c1c1e;--s-x-bg:#4a3e38;--s-x-fg:#c9bdb5}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;touch-action:manipulation}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}
input::placeholder{font-size:14px;color:var(--mut);opacity:.8}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Coque */
.demo{background:var(--ink);color:var(--surface);font-size:12.5px;padding:7px 16px;text-align:center}
.app{max-width:1260px;margin:0 auto;padding:20px;display:grid;grid-template-columns:244px minmax(0,1fr);gap:20px;align-items:start}
.side{background:var(--surface);border-radius:22px;box-shadow:var(--sh);padding:22px 14px 16px;position:sticky;top:20px;display:flex;flex-direction:column;gap:22px;min-height:calc(100vh - 100px)}
.logo{font:600 31px/1 'Playfair Display',Georgia,serif}
.tagl{font-size:11px;letter-spacing:.9px;color:var(--mut);margin-top:5px}
.brand{padding:0 10px}
.nav{display:flex;flex-direction:column;gap:3px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--mut);font-weight:500;text-align:left;width:100%}
.nv:hover{background:var(--card);color:var(--ink)}
.nv.on{background:var(--peach);color:var(--ink);font-weight:600}
.nv.on svg{color:var(--or-ink)}
.nv .bd{margin-left:auto;background:var(--or);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
.nv.shop{margin-top:auto;border:1.5px solid var(--line)}
.main{min-width:0;padding-bottom:40px}
.mhdr{display:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 18px;flex-wrap:wrap}
.top h1{font:600 31px/1.1 'Playfair Display',Georgia,serif}
.top p{margin:6px 0 0;color:var(--mut);max-width:60ch}
.bnav{display:none}

.app>div{min-width:0}
/* Composants */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--sh);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;padding:0 20px;font-weight:600;background:var(--surface);box-shadow:var(--sh);min-height:46px}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--or);color:#fff;box-shadow:var(--glow)}
.btn.dk{background:#1c1c1e;color:#fff}
.btn.dng{color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.s-n{background:var(--s-n-bg);color:var(--s-n-fg)}.s-c{background:var(--s-c-bg);color:var(--s-c-fg)}.s-f{background:var(--s-f-bg);color:var(--s-f-fg)}.s-p{background:var(--s-p-bg);color:var(--s-p-fg)}.s-i{background:var(--s-i-bg);color:var(--s-i-fg)}.s-x{background:var(--s-x-bg);color:var(--s-x-fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface);box-shadow:var(--sh);border-radius:99px;padding:8px 16px;white-space:nowrap;font-weight:500;font-size:14px;flex:none}
.chip.on{background:var(--ink);color:var(--surface)}
.chip em{font-style:normal;color:var(--mut);margin-left:6px}.chip.on em{color:inherit;opacity:.7}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:var(--sh);border-radius:24px;padding:0 16px;min-height:48px;margin-bottom:14px;color:var(--mut)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;padding:10px 0;color:var(--ink)}
.search:focus-within{box-shadow:0 0 0 2px var(--or)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600}
.fld input,.fld select{border:1.5px solid transparent;background:var(--card);border-radius:14px;padding:0 14px;min-height:48px;font-weight:400}
.fld input:focus,.fld select:focus{border-color:var(--or);outline:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--mut);font-size:13px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right;white-space:nowrap}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}.empty b{display:block;color:var(--ink);margin-bottom:4px}
.mut{color:var(--mut)}

/* Tableau de bord */
.hbanner{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(120deg,#fde6d8,#f9b89a);color:#1c1c1e;padding:22px 20px 20px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hbanner::after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.35)}
.hbanner::before{content:"";position:absolute;right:50px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25)}
.hbanner>*{position:relative;z-index:1}
.hbanner small{font-weight:600;font-size:13px}
.hbanner h2{font:600 28px/1.1 'Playfair Display',Georgia,serif;margin:4px 0 6px}
.hbanner p{margin:0;color:#444;max-width:44ch;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi b{display:block;font:600 26px/1.2 'Playfair Display',Georgia,serif;margin-top:4px}
.kpi span{color:var(--mut);font-size:13.5px}
.dgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.dgrid .card h3{font-size:16px;margin-bottom:12px}
.col2{display:flex;flex-direction:column;gap:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:8px}
.bar{flex:1;background:var(--peach);border-radius:6px 6px 0 0;min-height:3px}
.bar.t{background:var(--or)}
.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;margin-top:6px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.lrow:last-child{border-bottom:0}
button.lrow:hover b{color:var(--or-ink)}

/* Commandes */
.olayout{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}
.olist{display:flex;flex-direction:column;gap:10px}
.orow{display:block;text-align:left;width:100%;background:var(--surface);box-shadow:var(--sh);border-radius:18px;padding:13px 15px}
.orow:hover{box-shadow:0 0 0 1.5px var(--ink)}
.orow.on{box-shadow:0 0 0 2px var(--or)}
.orow .o1{display:flex;justify-content:space-between;font-size:13.5px;color:var(--mut)}.orow .o1 b{color:var(--ink)}
.orow .o2{font-weight:600;margin:2px 0 7px}
.orow .o3{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
.detail{position:sticky;top:20px}
.dhead{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-bottom:14px}
.dhead h2{font:600 25px 'Playfair Display',Georgia,serif}
.back{display:none;align-items:center;gap:2px;font-weight:600;color:var(--mut);min-height:40px;width:100%}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 18px}
.stp{font-size:12.5px;color:var(--mut);border-top:4px solid var(--line);border-radius:2px;padding-top:6px}
.stp.d{border-color:var(--ink);color:var(--ink)}.stp.n{border-color:var(--or);color:var(--ink);font-weight:600}
.banner{background:var(--s-x-bg);color:var(--s-x-fg);border-radius:14px;padding:11px 14px;margin:6px 0 16px;font-weight:500}
.who{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.who b{display:block}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:17px;padding:12px 10px 0}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.act{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border-radius:18px;padding:14px;min-height:112px}
.act:hover:not([disabled]){box-shadow:0 0 0 1.5px var(--ink)}
.act .ico{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin-bottom:6px;box-shadow:var(--sh)}
.act b{font-size:15px}.act small{color:var(--mut);font-size:13px;line-height:1.35}
.act.go{background:var(--or);color:#fff;box-shadow:var(--glow)}.act.go small{color:#fff;opacity:.9}.act.go .ico{background:#fff;color:var(--or-ink)}
.act[disabled]{opacity:.5;cursor:not-allowed}

/* Produits */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pc{text-align:left;background:var(--surface);box-shadow:var(--sh);border-radius:18px;padding:6px 6px 10px;display:flex;flex-direction:column}
.pc:hover{box-shadow:0 0 0 1.5px var(--ink)}
.pc .sw{height:150px;border-radius:13px;display:flex;align-items:center;justify-content:center;font:600 30px 'Playfair Display',Georgia,serif;background:var(--card);padding:10px;overflow:hidden}
.pc .sw img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.sw2 img{width:100%;height:100%;object-fit:contain;display:block}
.sw2{overflow:hidden;background:var(--card)}.sw2 img{padding:3px}
.pcat{margin:24px 0 6px}.pcat:first-of-type{margin-top:8px}
.pcat h2{font:600 21px 'Playfair Display',Georgia,serif;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pcat h2 i{width:12px;height:12px;border-radius:50%;flex:none}
.pcat h2 em{font:500 13px Inter,system-ui,sans-serif;font-style:normal;color:var(--mut)}
.pcat h4{margin:16px 0 8px;font:600 12.5px Inter,system-ui,sans-serif;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.who span{display:block}
.pc .bd{padding:10px 8px 0;display:flex;flex-direction:column;gap:3px}
.pc .bd b{font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--card);color:var(--mut)}
.tag.w{background:var(--s-c-bg);color:var(--s-c-fg)}.tag.e{background:#fde4e1;color:#a11d12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.e{background:#4a1d19;color:#ffaba3}}
.stk{display:inline-flex;align-items:center;gap:2px}
.stk button{width:36px;height:36px;border-radius:50%;background:var(--card);font-size:18px;line-height:1}
.stk button:hover{background:var(--peach)}
.stk input{width:52px;border:0;text-align:center;height:36px;background:none;-moz-appearance:textfield;font-weight:600}
.stk input::-webkit-outer-spin-button,.stk input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.vin{border:1.5px solid transparent;background:var(--card);border-radius:12px;padding:0 10px;width:100%;min-width:70px;height:40px}
.vin:focus{border-color:var(--or);outline:0}
.chk{display:flex;align-items:center;gap:10px;font-weight:500}.chk input{width:20px;height:20px;accent-color:var(--or)}
#vars{overflow-x:auto}
#vars td,#vars th{padding:6px 4px}

/* Fenêtres */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(28,28,30,.5);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.sheet{background:var(--surface);border-radius:24px;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;box-shadow:0 -8px 24px rgba(0,0,0,.1);outline:0}
.sheet.wide{width:min(760px,100%)}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh h3{font:600 22px 'Playfair Display',Georgia,serif}
.x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut);flex:none}.x:hover{background:var(--card)}
.seg{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:99px;margin-bottom:16px}
.seg button{flex:1;padding:9px 6px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--surface)}
.ft{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.ok{color:var(--ok);font-weight:600}.no{color:var(--red);font-weight:600}
.note{background:var(--card);border-radius:14px;padding:11px 13px;font-size:13.5px;color:var(--mut);margin-top:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#1c1c1e;color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.code{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px}

/* Facture (aperçu + impression) */
.inv{background:#fff;color:#1c1c1e;border:1px solid #ececee;border-radius:14px;padding:26px}
.inv h4{margin:0;font:700 26px 'Playfair Display',Georgia,serif}
.inv .ih{display:flex;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.inv table th{color:#6b6b70;border-color:#e6e6e9}.inv td{border-color:#e6e6e9}
.inv .tot{color:#1c1c1e}
.inv .ft2{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:22px;padding-top:16px;border-top:1px solid #e6e6e9}
.qr{width:92px;height:92px;border:1.5px dashed #9a9aa0;display:grid;place-items:center;text-align:center;font-size:11px;color:#6b6b70;padding:6px}
@media print{
 body *{visibility:hidden}
 #print,#print *{visibility:visible}
 #print{position:absolute;left:0;top:0;width:100%;border:0}
}

[hidden]{display:none!important}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.mv{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:0}
.mi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.mi.entree{background:var(--s-p-bg);color:var(--s-p-fg)}.mi.sortie{background:var(--s-c-bg);color:var(--s-c-fg)}
.mt{flex:1;min-width:0;display:flex;flex-direction:column}.mt .mut{font-size:13px}
.mq{font-size:16px;white-space:nowrap}.mq.entree{color:var(--ok)}

.seg.pg{max-width:380px;background:var(--surface);box-shadow:var(--sh);margin-bottom:12px}
.sg{padding:8px 16px 4px;margin-bottom:12px}
.sgh{display:flex;align-items:center;gap:12px;padding:8px 0 10px}
.sgh>div{flex:1;min-width:0;line-height:1.35}
.sw2{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:600 17px 'Playfair Display',Georgia,serif;flex:none}
.vr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.vl{flex:1;min-width:110px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.qn{font:600 24px/1 'Playfair Display',Georgia,serif;min-width:52px;text-align:right}
.qn.z{color:var(--red)}.qn.l{color:var(--s-c-fg)}
.va{display:flex;align-items:center;gap:8px}
.va input{width:140px;height:44px;border-radius:22px;border:1.5px solid transparent;background:var(--card);padding:0 14px;text-align:center}
.va input:focus{border-color:var(--or);outline:0}
.plus{width:44px;height:44px;border-radius:50%;background:var(--or);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;box-shadow:var(--glow);flex:none}

/* Mobile : même esprit que la boutique */
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr);padding:0 16px;gap:0}
 .side{display:none}
 .mhdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(16px + env(safe-area-inset-top,0px)) 0 14px}
 .mhdr a,.mhdr button{width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--sh);display:grid;place-items:center}
 .main{padding-bottom:96px}
 .top h1{font-size:26px}
 .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:50}
 .bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink);padding:4px 0;position:relative}
 .bnav button.on{color:var(--or);font-weight:600}
 .bnav .bd{position:absolute;top:-2px;left:calc(50% + 4px);background:var(--or);color:#fff;font-size:10px;font-weight:700;border-radius:8px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
 .kpis{grid-template-columns:1fr 1fr}
 .kpis.k3{gap:8px}.kpis.k3 .kpi{padding:14px 12px}.kpis.k3 .kpi b{font-size:21px}.kpis.k3 .kpi span{font-size:12.5px}
 .btns{width:100%}.btns .btn{flex:1}
 .va{flex-basis:100%;max-width:100%}.va input{flex:1;width:auto;min-width:0}
 .sgh .btn{padding:0 12px}
 .dgrid{grid-template-columns:1fr}
 .olayout{grid-template-columns:1fr}
 .detail{position:fixed;top:0;right:0;bottom:0;left:0;z-index:55;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 40px;transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility 0s .3s}
 .olayout.has .detail{transform:none;visibility:visible;transition:transform .3s,visibility 0s}
 .back{display:inline-flex}
 .acts{grid-template-columns:1fr}
 .act{min-height:0;flex-direction:row;align-items:center;gap:14px}
 .act .ico{margin:0}
 .grid2{grid-template-columns:1fr}
 .ov{align-items:end;padding:0}
 .sheet{border-radius:24px 24px 0 0;width:100%;max-height:92dvh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .stp{font-size:11px}
 .pgrid{grid-template-columns:repeat(2,1fr)}
 #ilist table,#ilist tbody{display:block}
 #ilist thead{display:none}
 #ilist tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"a c" "b e" "d f";gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
 #ilist tr:last-child{border-bottom:0}
 #ilist td{border:0;padding:0}
 #ilist td:nth-child(1){grid-area:a}#ilist td:nth-child(2){grid-area:b}#ilist td:nth-child(3){grid-area:c}#ilist td:nth-child(4){grid-area:d}#ilist td:nth-child(5){grid-area:e;text-align:right}#ilist td:nth-child(6){grid-area:f}
 .money{grid-template-columns:1fr!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}}
#login{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}
.lbox{width:min(400px,100%);display:grid;gap:14px;padding:26px}
.lerr{color:var(--red);font-size:13.5px;min-height:18px}
.qr.on{border:0;padding:0}.qr svg{width:100%;height:100%;display:block}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.pc{border-radius:14px;padding:4px 4px 8px}
.pc .sw{height:92px;padding:6px;border-radius:11px}
.pc .bd{padding:7px 6px 0;gap:1px;font-size:13px}.pc .bd .mut{font-size:12px}
.pcat h2{font-size:18px;margin-bottom:8px}.pcat{margin:16px 0 4px}.pcat h4{margin:10px 0 6px}
.sg{padding:4px 12px 2px;margin-bottom:8px;border-radius:16px}
.sgh{padding:6px 0;gap:10px}.sw2{width:36px;height:36px;border-radius:10px;font-size:13px}
.vr{padding:6px 0;gap:8px}.qn{font-size:18px;min-width:40px}
.va input{width:96px;height:36px;border-radius:18px;font-size:15px}.plus{width:36px;height:36px;font-size:22px}
.sgh .btn{min-height:32px;font-size:13px;padding:0 12px}
.szrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:13px;color:var(--mut)}
.szrow button{background:var(--card);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}.szrow button:hover{background:var(--peach)}
.gal{display:grid;gap:10px}
.gprev{position:relative;height:210px;background:var(--card);border-radius:16px;overflow:hidden;color:var(--mut);display:flex;align-items:center;justify-content:center;text-align:center}
.gprev img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain}
.gtag{position:absolute;left:8px;bottom:8px;background:rgba(28,28,30,.75);color:#fff;font-size:12px;border-radius:99px;padding:3px 10px}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchips button{background:var(--card);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}.gchips button.on{background:var(--ink);color:var(--surface)}
.gstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gt{background:var(--card);border-radius:12px;padding:5px;display:grid;gap:5px;border:2px solid transparent}.gt.on{border-color:var(--or)}
.gt img{width:100%;height:76px;object-fit:contain;cursor:pointer;display:block}
.gt select{width:100%;min-height:32px;border-radius:8px;border:0;background:var(--surface);font-size:13px;padding:0 4px}
.ga{display:flex;justify-content:space-between}
.ga button{width:30px;height:28px;border-radius:8px;background:var(--surface);font-size:16px;line-height:1}.ga button.on{background:var(--or);color:#fff}
.addimg{display:inline-flex;cursor:pointer}
.ft .dl{margin-right:auto}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block;flex:none}
.gchips button{display:inline-flex;align-items:center;gap:6px}.gchips em{font-style:normal;opacity:.65;font-weight:500}
.gnote{font-size:13px;color:var(--mut)}
/* Facture professionnelle */
.sheet.wide:has(.iv){width:min(860px,100%)}
.iv{background:#fff;color:#1c1c1e;border:1px solid #e3e3e6;border-radius:6px;padding:0;overflow:hidden;position:relative;font-size:13.5px;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.iv *{box-sizing:border-box}
.iv-bar{height:8px;background:linear-gradient(90deg,#ff6a1a,#ffb27a)}
.iv-in{padding:34px 40px 28px;position:relative}
.iv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.iv-brand b{font:700 30px/1 'Playfair Display',Georgia,serif;display:block}
.iv-brand span{display:block;color:#6b6b70;font-size:12.5px;margin-top:3px}
.iv-title{text-align:right}.iv-title h2{margin:0;font:700 26px/1 Inter,system-ui,sans-serif;letter-spacing:3px;color:#ff6a1a}
.iv-title div{margin-top:6px;font-size:15px;font-weight:600}
.iv-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:26px 0 22px;border:1px solid #e3e3e6;border-radius:8px;overflow:hidden}
.iv-meta div{padding:10px 14px;border-right:1px solid #e3e3e6}.iv-meta div:last-child{border-right:0}
.iv-meta small{display:block;color:#6b6b70;font-size:11px;letter-spacing:.7px;text-transform:uppercase;margin-bottom:2px}.iv-meta b{font-size:13.5px}
.iv-parties{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:24px}
.iv-parties small{display:block;color:#6b6b70;font-size:11px;letter-spacing:.7px;text-transform:uppercase;margin-bottom:5px;border-bottom:1.5px solid #ff6a1a;padding-bottom:4px;width:max-content}
.iv-parties b{font-size:15px;display:block}.iv-parties span{display:block;color:#3c3c40}
.iv table{width:100%;border-collapse:collapse}
.iv th{background:#1c1c1e;color:#fff;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;text-align:left;padding:9px 12px;border:0}
.iv th.r,.iv td.r{text-align:right}.iv td{padding:10px 12px;border:0;border-bottom:1px solid #ececee;vertical-align:top}
.iv tbody tr:nth-child(even) td{background:#fafafa}.iv td .v{display:block;color:#6b6b70;font-size:12px}
.iv-tot{display:flex;justify-content:flex-end;margin-top:14px}
.iv-tot table{width:300px}.iv-tot td{border:0;padding:6px 12px;background:none!important}
.iv-tot tr.g td{background:#1c1c1e!important;color:#fff;font-weight:700;font-size:16px;border-radius:0}
.iv-pay{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
.iv-stamp{border:2.5px solid #14663a;color:#14663a;border-radius:8px;padding:6px 18px;font:700 20px/1 Inter,system-ui,sans-serif;letter-spacing:3px;transform:rotate(-5deg)}
.iv-stamp.x{border-color:#c62828;color:#c62828}
.iv-foot{display:flex;align-items:center;gap:16px;margin-top:26px;padding-top:18px;border-top:1px solid #e3e3e6}
.iv-foot .qr{width:96px;height:96px;flex:none}
.iv-foot p{margin:0;color:#4b4b50;font-size:12.5px}.iv-foot .code{font-size:17px;color:#1c1c1e}
.iv-legal{margin-top:16px;text-align:center;color:#8a8a8e;font-size:11.5px}
.iv-wm{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;pointer-events:none;font:800 110px/1 Inter,system-ui,sans-serif;color:rgba(198,40,40,.12);transform:rotate(-24deg);letter-spacing:8px}
@media print{@page{size:A4;margin:10mm}.iv{border:0;border-radius:0}}

const pctS=r=>String(+(r*100).toFixed(2));
const pcp=v=>String(+(+v).toFixed(2));
const nz=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
/* Règles souples : c'est vous qui décidez. Seules les valeurs impossibles sont refusées ; le reste déclenche un avertissement avec ses conséquences. */
const okPct=(v,what)=>{if(v<0){toast('Une réduction négative est impossible');return false}
 if(v>100){toast('Au-dessus de 100 %, le prix deviendrait négatif : impossible');return false}
 if(v>90)return confirm('−'+pcp(v)+' % '+(what||'')+'\n\nConséquence : le client ne paiera que '+pcp(100-v)+' % du prix (un article à 100 $ coûtera '+fmt(100-v)+').\n\nContinuer quand même ?');
 return true};
const promoImg=p=>p&&p.image?imgUrl(p.image):LEFE_IMG;
const promoCard=c=>`<div class="pcp"><div class="lw"><img class="lefe" alt="" src="${c.img}"><div><b>${esc(c.code||'CODE')}</b><small>${c.pct||0}% de réduction · dès ${c.min||0} pcs, toutes catégories</small><small>Panier : 0 / ${c.min||0} pcs</small></div></div><span class="pcb">Appliquer</span></div>`;
const promoExp=p=>p.ends_at&&p.ends_at<new Date().toISOString().slice(0,10);
/* ============ Promotions : onglets ============ */
const netP=(price,pct)=>Math.round((+price||0)*(1-(+pct||0)/100)*100)/100;
const SETD={tier_on:true,tier_min:100,tier_off:0.1,flash_on:true,flash_end:null,flash_title:''};
const PT=[['codes','Codes promo','Le client tape un code dans son panier'],['disc','Réductions produits','Un % de remise sur un produit'],['tier','Prix par quantité','Remise quand il commande beaucoup'],['flash','Vente flash','Le bandeau et le compte à rebours']];
VIEWS.promos=()=>{S.pt=S.pt||'codes';const t=PT.find(x=>x[0]===S.pt);return `<div class="top"><div><h1>Promotions</h1><p>Tout ce qui fait baisser les prix sur la boutique, au même endroit.</p></div>${S.pt==='codes'?`<button class="btn pri" data-act="addpromo">${ic('plus')}Ajouter un code promo</button>`:''}</div>
 <div class="ptabs">${PT.map(x=>`<button class="ptb ${S.pt===x[0]?'cur':''}" data-act="ptab" data-t="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div><div id="ptab"></div>`};
const noSql=()=>`<div class="card" style="border:1px solid #c62828;color:#c62828"><b>Une mise à jour de la base est nécessaire</b><div style="font-size:13px;margin-top:4px">Exécutez <b>bangmarket_promos.sql</b> puis <b>bangmarket_prix.sql</b> dans Supabase (SQL Editor), puis rechargez cette page.</div></div>`;
function pnetUp(){const f=$('[data-form="prod"]'),e=$('#pnet');if(!f||!e)return;const pc=+f.elements.pct.value||0,pr=+f.elements.price.value||0;e.textContent=pc>0?'Le client paie '+fmt(netP(pr,pc))+' (au lieu de '+fmt(pr)+')':''}
function paintPromos(){const l=$('#ptab');if(!l)return;S.pt=S.pt||'codes';({codes:paintCodes,disc:paintDisc,tier:paintTier,flash:paintFlash})[S.pt](l)}
function paintCodes(l){
 if(S.promos===null){l.innerHTML=noSql();return}
 l.innerHTML=`<div class="hlp">Un <b>code promo</b> donne un pourcentage de réduction sur tout le panier, à partir d'un nombre de pièces. Le client le saisit dans son panier ou le touche dans l'onglet Offres.</div>`+(S.promos.length?S.promos.map(p=>{const ex=promoExp(p),off=!p.active||ex;return `<div class="pwrap ${off?'off':''}">${promoCard({code:p.code,pct:pctS(+p.rate),min:p.min_qty,img:promoImg(p)})}<div class="pact"><span class="pst ${off?'':'on'}">${ex?'Expiré':p.active?'Actif sur la boutique':'Désactivé'}${p.ends_at&&!ex?' · jusqu\'au '+fdate(new Date(p.ends_at)):''}</span><button class="btn sm" data-act="tagfrom" data-k="promo" data-c="${esc(p.code)}">Créer l'étiquette</button><button class="btn sm" data-act="togpromo" data-c="${esc(p.code)}">${p.active?'Désactiver':'Activer'}</button><button class="btn sm" data-act="editpromo" data-c="${esc(p.code)}">Modifier</button><button class="btn sm dng" data-act="delpromo" data-c="${esc(p.code)}">Supprimer</button></div></div>`}).join(''):'<div class="card empty"><b>Aucun code promo</b>Créez votre premier code avec « Ajouter un code promo ».</div>')}
const tierTxt=p=>p.tmin==null&&p.toff==null?'Règle du site':(+p.toff>0?`Dès ${p.tmin} pcs : −${fmt(p.toff)}/pc`:'Aucun');
function paintDisc(l){
 if(!S.pricingOk){l.innerHTML=noSql();return}
 S.pc=S.pc||'Toutes';const cats=['Toutes',...allCats()],noimg=(S.allProducts||[]).filter(p=>!(p.images||[]).length),list=S.products.filter(p=>S.pc==='Toutes'||p.cat===S.pc),on=S.products.filter(p=>p.pct>0).length;
 l.innerHTML=`<div class="hlp"><b>Comment ça marche :</b> tapez un pourcentage à côté d'un produit. Le client voit l'ancien prix barré, un badge rouge « −X% » et paie le nouveau prix. Mettez <b>0</b> pour retirer la réduction. <b>${on}</b> produit${on>1?'s':''} en promotion actuellement.</div>
 <div class="card pbulk"><b>Nouvelle réduction</b><div class="prow"><span class="mut" style="flex:1;font-size:13px">Choisissez les produits, le pourcentage, et créez au besoin une étiquette pour l'annoncer.</span><button class="btn pri sm" data-act="discnew">Ajouter une réduction</button></div></div>
 <div class="card pbulk"><b>Étiquette d'accueil</b><div class="prow"><span class="mut" style="flex:1;font-size:13px">Annoncez vos réductions avec une étiquette sur l'accueil.</span><button class="btn sm" data-act="tagfrom" data-k="disc">Créer l'étiquette</button></div></div>
 <div class="card pbulk"><b>Appliquer à toute une catégorie</b><div class="prow"><select id="pbc">${allCats().map(c=>`<option>${esc(c)}</option>`).join('')}</select><label class="pin"><input id="pbp" type="number" step="any" placeholder="0"><span>%</span></label><button class="btn pri sm" data-act="pbapply">Appliquer</button></div></div>
 ${noimg.length?`<div class="cpw" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>📷 <b>${noimg.length}</b> produit${noimg.length>1?'s':''} sans photo ${noimg.length>1?'sont masqués':'est masqué'} du site${S.pni?'':' et de cette liste'}.</span><button class="btn sm" data-act="pnoimg">${S.pni?'Cacher ces produits':'Les afficher'}</button></div>`:''}
 <div class="chips" id="pdc">${cats.map(c=>`<button class="chip ${S.pc===c?'on':''}" data-act="pdcat" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
 <div class="pdl">${list.length?list.map(p=>`<div class="pdr" data-r="${p.id}"><div class="pdth">${photo(p)}</div><div class="pdi"><b>${esc(p.name)}</b><small>${esc(p.cat)} · Prix normal <b>${fmt(p.price)}</b> · ${tierTxt(p)}</small></div><div class="pdv"><label class="pin"><input type="number" step="any" value="${p.pct||0}" data-pdisc="${p.id}" aria-label="Réduction en pourcentage"><span>%</span></label><button type="button" class="btn sm" data-act="tagfrom" data-k="prod" data-id="${p.id}">Étiquette</button><div class="pdn ${p.pct>0?'on':''}" id="pn${p.id}">${p.pct>0?'Client paie '+fmt(netP(p.price,p.pct)):'Pas de réduction'}</div></div></div>`).join(''):'<div class="card empty"><b>Aucun produit</b></div>'}</div>`}
function paintTier(l){
 if(S.sets===null){l.innerHTML=noSql();return}
 const s={...SETD,...S.sets},ex=S.products[0],pr0=ex?netP(ex.price,ex.pct):5,mo=ex?ex.moq:10,ov=S.products.filter(p=>p.tmin!=null||p.toff!=null);
 l.innerHTML=`<div class="hlp"><b>Le prix par quantité</b> (tarif dégressif) : plus le client commande de pièces <b>du même produit</b>, moins chaque pièce coûte. Les couleurs et les tailles s'additionnent. C'est la règle de <b>tout le site</b>. Un produit peut avoir sa propre règle (fiche produit › Prix et réductions).</div>
 <form class="card tform" data-form="tier"><label class="chk"><input type="checkbox" name="on" ${s.tier_on?'checked':''}> Activer le prix par quantité sur le site</label>
 <div class="grid2"><label class="fld">À partir de (pièces d'un même produit)<input name="min" id="tmn" type="number" step="any" value="${s.tier_min}" required></label><label class="fld">Remise par pièce ($)<input name="off" id="tmo" type="number" step="any" value="${s.tier_off}" required></label></div>

 <label class="fld" style="margin-top:10px">Fin de l'offre (obligatoire)<input name="end" type="datetime-local" value="${end}"></label></div>
 <label class="chk"><input type="checkbox" name="active" ${x.active?'checked':''}> Afficher cette vente flash sur la boutique</label>
 <div class="ft"><button type="button" class="btn" data-act="close">Fermer</button><button class="btn pri">Enregistrer</button></div></form>`)}
let DF=null;
function discForm(){if(!S.pricingOk)return toast('Mise à jour de la base nécessaire (bangmarket_prix.sql)');DF=1;
 modal(head('Nouvelle réduction')+`<form data-form="disc"><label class="fld">Pourcentage de réduction<input name="pct" type="number" step="any" required placeholder="Ex. 20"></label>
 <div class="lb2">Produits concernés <span id="dsn" class="mut"></span></div><input id="dsq" type="search" placeholder="Rechercher un produit" style="width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.12);margin-bottom:8px">
 <div class="chips">${allCats().map(c=>`<button type="button" class="chip" data-act="dsall" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
 <div id="dsl" style="display:grid;gap:6px;max-height:230px;overflow:auto;margin:8px 0 12px">${S.products.map(p=>`<label data-n="${esc(p.name.toLowerCase())}" style="${rowS}"><input type="checkbox" name="pid" value="${p.id}" data-c="${esc(p.cat)}"><span class="pdth" style="width:38px;height:38px">${photo(p)}</span><div><b>${esc(p.name)}</b><small style="display:block" class="mut">${esc(p.cat)} · ${fmt(p.price)}${p.pct?' · déjà −'+pcp(p.pct)+'%':''}</small></div></label>`).join('')}</div>
 <label class="chk"><input type="checkbox" name="mk" id="dmk"> Créer aussi une étiquette pour annoncer cette réduction</label>
 <div id="dtg" style="display:none;margin-top:10px"><div class="lb2">Aperçu de l'étiquette</div><div id="dtp" style="margin-bottom:10px"></div>
 <label class="fld">Titre<input name="tlabel" placeholder="Ex. −20% cette semaine"></label><label class="fld">Sous-titre<input name="tsub" placeholder="Ex. sur une sélection de produits"></label>
 <div class="grid2"><label class="fld">Icône<select name="ticon">${['🔥','🏷️','🎁','⭐','💥','🎉','💰','🆕'].map(i=>`<option>${i}</option>`).join('')}</select></label><label class="fld">Couleur<select name="tcolor">${opts({rouge:'Rouge',orange:'Orange',vert:'Vert',violet:'Violet',noir:'Noir',or:'Doré'},'rouge')}</select></label></div>
 <label class="fld">Transition d'entrée<select name="tanim">${opts(TANL,'slide')}</select></label>
 <label class="chk"><input type="checkbox" name="tactive"> Afficher l'étiquette sur la boutique dès maintenant</label></div>
 <div class="ft"><button type="button" class="btn" data-act="close">Fermer</button><button class="btn pri">Appliquer la réduction</button></div></form>`);dfPv()}
function dfPv(){const f=$('[data-form="disc"]');if(!f)return;const ids=[...f.querySelectorAll('[name=pid]:checked')],n=ids.length,pct=+f.elements.pct.value||0,one=n===1?prod(+ids[0].value):null;
 $('#dsn').textContent=n?'· '+n+' sélectionné'+(n>1?'s':''):'';
 const e=$('#dtp');if(e)e.innerHTML=tagPrev({label:f.elements.tlabel.value||'−'+(pcp(pct)||'X')+'%',sub:f.elements.tsub.value||(one?one.name:'sur une sélection de produits'),icon:f.elements.ticon.value,color:f.elements.tcolor.value})}
Object.assign(A,{
 flnew:()=>flForm(null),
 fledit:d=>{const f=(S.flashes||[]).find(x=>x.id==d.id);f&&flForm({...f})},
 fltog:d=>{const f=(S.flashes||[]).find(x=>x.id==d.id);f&&run(async()=>must(await sb.from('flash_sales').update({active:!f.active}).eq('id',f.id)),f.active?'Vente flash masquée':'Vente flash affichée sur la boutique')},
 fldel:d=>{confirm('Supprimer cette vente flash ?')&&run(async()=>must(await sb.from('flash_sales').delete().eq('id',d.id)),'Vente flash supprimée')},
 flup:d=>reorder('flash_sales',S.flashes,d.id,-1),fldn:d=>reorder('flash_sales',S.flashes,d.id,1),
 flkind:d=>{const f=$('[data-form="fl"]');if(!f)return;f.elements.kind.value=d.k;$('#flc').style.display=d.k==='code'?'grid':'none';$('#fld2').style.display=d.k==='disc'?'block':'none';f.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k))},
 discnew:()=>discForm(),
 dsall:d=>{const f=$('[data-form="disc"]');if(!f)return;const b=[...f.querySelectorAll('[name=pid]')].filter(x=>x.dataset.c===d.c),all=b.every(x=>x.checked);b.forEach(x=>x.checked=!all);dfPv()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.closest&&t.closest('[data-form="disc"]')){if(t.id==='dsq'){const q=t.value.trim().toLowerCase();document.querySelectorAll('#dsl label').forEach(l=>l.style.display=!q||l.dataset.n.includes(q)?'flex':'none')}dfPv()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='dmk'){$('#dtg').style.display=t.checked?'block':'none';dfPv()}else if(t.closest&&t.closest('[data-form="disc"]'))dfPv()});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-form]');if(!f)return;const k=f.dataset.form;if(k!=='fl'&&k!=='disc')return;e.preventDefault();const fd=new FormData(f);
 if(k==='fl'){const kind=fd.get('kind'),row={kind,title:String(fd.get('title')||'').trim(),active:!!fd.get('active'),code:null,product_ids:[],ends_at:null};
  if(kind==='code'){const c=fd.get('code'),p=(S.promos||[]).find(x=>x.code===c);if(!p)return toast('Choisissez un code promo');if(!p.ends_at)return toast('Ce code n\'a pas de date de fin : impossible de l\'ajouter');row.code=c;row.ends_at=new Date(p.ends_at+'T23:59:59').toISOString()}
  else{const ids=fd.getAll('pid').map(Number);if(!ids.length)return toast('Choisissez au moins un produit');if(!fd.get('end'))return toast('Indiquez la fin de l\'offre : sans délai, impossible de l\'ajouter');row.product_ids=ids;row.ends_at=new Date(fd.get('end')).toISOString()}
  if(new Date(row.ends_at).getTime()<=Date.now())return toast('Cette date de fin est déjà passée');
  if(await run(async()=>{FL&&FL.id?must(await sb.from('flash_sales').update(row).eq('id',FL.id)):must(await sb.from('flash_sales').insert({...row,position:(S.flashes||[]).length}))},'Vente flash enregistrée'))closeModal()}
 if(k==='disc'){const pct=nz(fd.get('pct')),ids=fd.getAll('pid').map(Number);if(!pct)return toast('Entrez un pourcentage');if(!ids.length)return toast('Choisissez au moins un produit');if(!okPct(pct,'sur '+ids.length+' produit'+(ids.length>1?'s':'')))return;const mk=!!fd.get('mk');
  if(mk&&S.tags===null)return toast('Étiquettes : exécutez d\'abord bangmarket_vitrine.sql');
  if(await run(async()=>{must(await sb.from('products').update({discount_pct:pct}).in('id',ids));
   if(mk){const one=ids.length===1?prod(ids[0]):null;must(await sb.from('shop_tags').insert({kind:'disc',label:(String(fd.get('tlabel')||'').trim()||'−'+pcp(pct)+'%'),sub:String(fd.get('tsub')||'').trim()||(one?one.name:'sur une sélection de produits'),icon:fd.get('ticon'),color:fd.get('tcolor'),anim:fd.get('tanim'),secs:7,link:one?'product':'offers',product_id:one?one.id:null,code:null,active:!!fd.get('tactive'),position:(S.tags||[]).length}))}},
   mk?'−'+pcp(pct)+'% appliqué · étiquette créée (Vitrine › Étiquettes)':'−'+pcp(pct)+'% appliqué à '+ids.length+' produit'+(ids.length>1?'s':'')))closeModal()}});
boot();
</script>
</body>
</html>
