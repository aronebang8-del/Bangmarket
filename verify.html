<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bang Market · Vérifier une facture</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe3da;--surface:#fff;--ink:#1c1c1e;--mut:#6b6b70;--card:#f6f6f7;--or:#ff6a1a;--ok:#14663a;--okbg:#dff3e6;--red:#c62828;--redbg:#fde4e2}
@media (prefers-color-scheme:dark){:root{--bg:#2a2320;--surface:#3a302b;--ink:#f4ece6;--mut:#b5a89f;--card:#2f2723;--ok:#7fd6a1;--okbg:#153322;--red:#ff8a80;--redbg:#3d1f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--surface);border-radius:22px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:26px;width:min(440px,100%);display:grid;gap:16px}
.logo{font:600 30px/1 'Playfair Display',Georgia,serif}
.tagl{font-size:12px;letter-spacing:.8px;color:var(--mut);margin-top:5px}
form{display:grid;gap:10px}
label{font-weight:600;font-size:13.5px}
input{font:inherit;font-size:18px;letter-spacing:2px;text-transform:uppercase;text-align:center;border:1.5px solid transparent;background:var(--card);color:inherit;border-radius:14px;min-height:50px;width:100%}
input:focus{border-color:var(--or);outline:0}
button{font:inherit;font-weight:600;background:var(--or);color:#fff;border:0;border-radius:99px;min-height:48px;cursor:pointer}
button[disabled]{opacity:.5}
.res{border-radius:16px;padding:16px;display:grid;gap:4px}
.res.ok{background:var(--okbg);color:var(--ok)}.res.ko{background:var(--redbg);color:var(--red)}
.res b{font-size:17px}.res dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;color:var(--ink)}
.res dt{color:var(--mut)}.res dd{margin:0;font-weight:600;text-align:right}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<main class="box">
 <div><div class="logo">Bang Market</div><div class="tagl">VÉRIFICATION D'UNE FACTURE</div></div>
 <form id="f"><label for="c">Code de vérification</label><input id="c" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off" required><button id="b">Vérifier</button></form>
 <div id="r" aria-live="polite"></div>
</main>
<script>
const sb=window.supabase.createClient('https://fmbgxwqhxarpfnwxemxe.supabase.co','sb_publishable_AoOhp570RvrOyEvKMjpj3w_uZdAemBm');
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function check(code){
 const r=$('#r'),b=$('#b');code=code.trim().toUpperCase();
 if(code.length<8){r.innerHTML='<div class="res ko"><b>Code incomplet</b>Le code a la forme XXXX-XXXX.</div>';return}
 b.disabled=true;r.textContent='Vérification…';
 try{
  const {data,error}=await sb.rpc('verify_invoice',{p_code:code});
  if(error)throw error;
  if(!data||!data.length){r.innerHTML='<div class="res ko"><b>Facture introuvable</b>Ce code ne correspond à aucune facture Bang Market.</div>';return}
  const f=data[0],ok=f.status==='valide';
  r.innerHTML=`<div class="res ${ok?'ok':'ko'}"><b>${ok?'✓ Facture authentique':'Facture annulée'}</b>${ok?'Cette facture a bien été émise par Bang Market.':'Cette facture a été annulée par Bang Market. Elle n\'est plus valable.'}<dl><dt>Numéro</dt><dd>${esc(f.no)}</dd><dt>Date</dt><dd>${new Date(f.d+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</dd><dt>Montant</dt><dd>${(Math.round(f.total*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2})} $</dd></dl></div>`;
 }catch(e){r.innerHTML='<div class="res ko"><b>Vérification impossible</b>Réessayez dans un instant.</div>'}
 finally{b.disabled=false}
}
$('#f').addEventListener('submit',e=>{e.preventDefault();check($('#c').value)});
const c0=new URLSearchParams(location.search).get('c');if(c0){$('#c').value=c0;check(c0)}
</script>
</body>
</html>
